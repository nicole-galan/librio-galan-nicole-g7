{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LIBRIO</title>
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body>

    <div class="register-container">

        <div class="brand">
            <h1>LIBRIO</h1>
            <p>Your Books, Your Corner.</p>
        </div>

        <div class="register-content">
            <h2>Create your account</h2>
            <p class="subtitle">A little space for all your books and thoughts.</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">Create Account</button>
            </form>

            <p class="login-text">
                Already have an account? <a href="#">Log in</a>
            </p>
        </div>

    </div>

</body>
</html>
