
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LIBRIO</title>
</head>
<body>

    <div class="register-container">
        <h1>LIBRIO</h1>
        <p>Your Books, Your Corner.</p>

        <h2>Create your account</h2>
        <p>Start organizing your personal book collection.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account? <a href="#">Log in</a></p>
    </div>

</body>
</html>
